name: TypeScript

on:
  push:
    branches:
      - "Typescript-type"
  pull_request:
    branches:
      - "Typescript-type"

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify generated runtime exists
        run: test -s js/game.js
